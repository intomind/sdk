[package]
name = "intomind"
description = "The IntoMind instrument client: the protocol, the timebase, and the capture format, over any transport you already have."
documentation = "https://docs.intomind.com/rust.html"
repository = "https://github.com/intomind/sdk"
homepage = "https://intomind.com"
keywords = ["eeg", "bci", "ble", "instrument", "neuroscience"]
categories = ["science", "hardware-support"]
readme = "README.md"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
intomind-protocol = { workspace = true }
intomind-pipeline = { workspace = true }
intomind-capture = { workspace = true }
intomind-model = { workspace = true, optional = true }
# A transfer names itself by the hash of what is being sent, so an
# interrupted one resumes only against the same bytes. The codec crate
# stays dependency free; this one is a host crate and may hash.
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
# The publication check reads every tracked file. A small engine, because
# this is a check and not a feature.
regex-lite = "0.1"

[features]
default = []
#: The encoder, so a host can produce the same embeddings the device does.
model = ["dep:intomind-model"]
