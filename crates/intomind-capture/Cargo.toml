[package]
name = "intomind-capture"
description = "What an IntoMind recording is on disk: read as every IntoMind program writes it, and exported as npz, edf, bdf, csv, tsv and mat."
documentation = "https://docs.intomind.com/rust.html"
repository = "https://github.com/intomind/sdk"
homepage = "https://intomind.com"
keywords = ["eeg", "bci", "recording", "provenance"]
categories = ["science", "filesystem"]
readme = "README.md"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
intomind-protocol = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deflate for the `.npz` a recording and an export are written in, as numpy
# writes them, and the checksum every recording carries.
miniz_oxide = "0.8"
sha2 = "0.10"
