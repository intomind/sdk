[package]
name = "intomind-capture"
description = "The IntoMind capture format: what a recording is on disk, written so it can be read in fifty years."
documentation = "https://docs.intomind.com/rust.html"
repository = "https://github.com/intomind/sdk"
homepage = "https://intomind.com"
keywords = ["eeg", "bci", "recording", "provenance"]
categories = ["science", "filesystem"]
readme = "README.md"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
intomind-protocol = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
